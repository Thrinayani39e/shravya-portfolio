<section id="contact">
  <div class="motif" aria-hidden="true">
    <svg viewBox="0 0 400 300">
      <g fill="none" stroke="currentColor" stroke-width="1.1">
        <g transform="translate(250,150)"><circle r="120" /><circle r="86" /><circle r="20" /><path d="M0-120V-24M0 24V120M-120 0H-24M24 0H120M-85-85 -17-17M85 85 17 17M85-85 17-17M-85 85 -17 17" /></g>
        <g transform="translate(78,232)"><circle r="46" /><circle r="10" /><path d="M0-46V-20M0 20V46M-46 0H-20M20 0H46M-33-33 -14-14M33 33 14 14M33-33 14-14M-33 33 -14 14" /></g>
        <g transform="translate(46,96)"><circle r="26" /><circle r="6" /><path d="M0-26V-11M0 11V26M-26 0H-11M11 0H26" /></g>
      </g>
    </svg>
  </div>

  <div class="wrap inner">
    <div class="band"><span class="num">08</span><h2>{{ contact().band }}</h2></div>
    <p class="contact-line">{{ contact().line }}</p>

    <div class="contact-grid">
      <div *ngFor="let c of contact().items">
        <dt>{{ c.k }}</dt>
        <a [href]="c.href" [target]="c.href.startsWith('http') ? '_blank' : null" [rel]="c.href.startsWith('http') ? 'noopener' : null">{{ c.v }}</a>
      </div>
    </div>
  </div>
</section>
