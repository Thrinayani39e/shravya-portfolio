<section id="publications" class="wrap content">
  <div class="band"><span class="num">04</span><h2>{{ pubs().band }}</h2></div>

  <ol class="pub-list">
    <li class="pub-item" *ngFor="let pub of pubs().items">
      <span class="pub-n">{{ pub.n }}</span>
      <div>
        <div class="pub-meta">
          <span class="pub-kind">{{ pub.kind }}</span>
          <span class="pub-venue">{{ pub.venue }}</span>
        </div>
        <p class="pub-title">{{ pub.title }}</p>
        <p class="pub-detail">{{ pub.detail }}</p>
        <a *ngIf="pub.href" class="pub-doi" [href]="pub.href" target="_blank" rel="noopener">{{ pub.doi }}</a>
      </div>
    </li>
  </ol>

  <div class="hr"></div>
</section>
