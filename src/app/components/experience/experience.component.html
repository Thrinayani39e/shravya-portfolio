<section id="experience" class="wrap content">
  <div class="band"><span class="num">02</span><h2>{{ exp().band }}</h2></div>

  <div class="exp-card">
    <div class="exp-years">
      <span *ngFor="let y of years">{{ y }}</span>
    </div>

    <div class="exp-item" *ngFor="let job of exp().items">
      <div class="exp-head">
        <div>
          <h3>{{ job.role }}</h3>
          <p class="org">{{ job.org }}</p>
        </div>
        <span class="dates">{{ job.dates }}</span>
      </div>

      <div class="exp-track">
        <div class="bar" [style.left]="bar(job.start, job.end).left" [style.width]="bar(job.start, job.end).width"></div>
      </div>

      <ul class="exp-bullets">
        <li *ngFor="let b of job.bullets">
          <span class="dash">•</span>
          <span>{{ b }}</span>
        </li>
      </ul>
    </div>
  </div>
</section>
